            const [offeredInput, setOfferedInput] = useState(5);
            const [acceptedInput, setAcceptedInput] = useState(4);
            const [rejectedInput, setRejectedInput] = useState(1);
            const [rejectionReasonInput, setRejectionReasonInput] = useState('');

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 2800);
            };

            const currentBatches = batches.filter(b => b.dataMode === dataMode);
            const currentHandovers = handovers.filter(h => h.dataMode === dataMode);

            // 3 thẻ thống kê theo đặc tả Trang 3 & 10
            const totalDeliveredKg = currentHandovers.reduce((acc, h) => acc + h.acceptedWeight, 0);

            const pendingKg = currentBatches.reduce((acc, b) => acc + b.remainingQuantity, 0);

            const handleRecordHandover = () => {
                if (!targetBatch) return;
                if (acceptedInput + rejectedInput !== offeredInput) {
                    alert(`Lỗi cộng số: Được nhận (${acceptedInput}) + từ chối (${rejectedInput}) phải bằng trình giao (${offeredInput})`);

                }

                    if (b.id === targetBatch.id) {
                        return {
                            ...b,
                            remainingQuantity: Math.max(0, b.remainingQuantity - acceptedInput)
                        };
                    }
                    return b;
                }));

                                            Nhật ký các lần bàn giao thực tế ({currentHandovers.length})
                                        </div>
                                        <table className="w-full text-xs text-left">
                                            <thead className="bg-slate-50 text-slate-600 uppercase font-bold text-[11px]">
                                                <tr>
                                                    <th className="p-3">Mã sự kiện</th>
                                                    <th className="p-3">Lô & Điểm nhận</th>
                                                    <th className="p-3 text-right">Trình giao</th>
                                                    <th className="p-3 text-right text-emerald-700">Được nhận</th>
                                                    <th className="p-3 text-right text-red-600">Từ chối</th>
                                                    <th className="p-3">Cấp xác nhận</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {currentHandovers.map(h => (
                                                    <tr key={h.id} className="hover:bg-slate-50">
                                                        <td className="p-3 font-mono font-bold">{h.id}</td>
                                                        <td className="p-3">
                                                            <b>{h.batchId}</b>
                                                            <div className="text-[11px] text-slate-500">{h.hubName} · {h.date}</div>
                                                        </td>
                                                        <td className="p-3 text-right font-mono">{h.offeredWeight} kg</td>
                                                        <td className="p-3 text-right font-mono font-bold text-emerald-700">+{h.acceptedWeight} kg</td>
                                                        <td className="p-3 text-right font-mono text-red-600">
                                                            {h.rejectedWeight > 0 ? `-${h.rejectedWeight} kg (${h.rejectionReason})` : '0 kg'}
                                                        </td>
                                                        <td className="p-3">
                                                            <span className="bg-emerald-50 text-emerald-800 text-[10.5px] font-bold px-2 py-0.5 rounded border border-emerald-200">
                                                                Xác nhận nơi nhận
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* ==================================================== */}
                            {/* TAB 5: ĐIỆN RÁC & MÔ PHỎNG (CHUẨN 100KG = 17.85 KWH) */}
                            {/* ==================================================== */}
                            {currentTab === 'energy' && (
                                <div className="space-y-5">
                                    <div className="pb-2 border-b border-emerald-950/10">
                                        <h1 className="text-2xl font-extrabold text-[#07241b]">Điện Rác: Kịch Bản & So Sánh Phương Án</h1>
                                        <p className="text-xs sm:text-sm text-slate-600">Mô phỏng mẻ 100 kg kiểm tra kế thừa (Page 12 đặc tả THPT Chuyên Chu Văn An).</p>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div className="p-5 bg-gradient-to-br from-[#07241b] to-[#144d37] text-white rounded-2xl shadow-sm space-y-1">
                                            <span className="text-xs text-emerald-300 font-bold uppercase">ĐIỆN RÒNG ƯỚC TÍNH (MÔ PHỎNG)</span>
                                            <div className="text-3xl font-black font-mono">17.85 <span className="text-base font-normal">kWh</span></div>
                                            <p className="text-xs text-emerald-200">Sau khi trừ 10% điện tự dùng của lò</p>
                                        </div>

                                        <div className="p-5 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-1">
                                            <span className="text-xs text-slate-500 font-bold uppercase">MỐC ĐỐT HỖN HỢP LÝ THUYẾT</span>
                                            <div className="text-3xl font-black font-mono text-slate-700">37.75 <span className="text-base font-normal">kWh</span></div>
                                            <p className="text-xs text-slate-500">Nếu đốt toàn bộ không phân loại (mất sạch vật liệu)</p>
                                        </div>

                                        <div className="p-5 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-1">
                                            <span className="text-xs text-emerald-800 font-bold uppercase">VẬT LIỆU THU HỒI TUẦN HOÀN</span>
                                            <div className="text-2xl font-black text-emerald-800">32.0 kg tái chế</div>
                                            <p className="text-xs text-slate-500">+ 24.5 kg rác hữu cơ ủ phân compost</p>
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-3">
                                        <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                                            <h3 className="font-bold text-slate-900 text-sm">Phân bổ dòng vật liệu mẻ 100 kg mẫu gốc:</h3>
                                            <span className="font-mono text-xs text-slate-500">η = 20%, Tự dùng = 10%</span>
                                        </div>
                                        <div className="text-xs space-y-1.5 leading-relaxed">
                                            <div>♻ <b>Thu hồi tái chế vật liệu:</b> 32.0 kg (80% nhựa, giấy, kim loại)</div>
                                            <div>🌿 <b>Thu hồi sinh học (Ủ phân hữu cơ):</b> 24.5 kg</div>
                                            <div>♨ <b>Tuyến thu hồi nhiệt điện (vào lò đốt):</b> 35.5 kg</div>
                                            <div>🧱 <b>Vô cơ trơ khác:</b> 3.0 kg</div>
                                            <div>⚠ <b>Pin & thu gom chuyên biệt:</b> 5.0 kg</div>
                                        </div>
                                        <div className="p-3 bg-amber-50 text-amber-900 rounded-xl border border-amber-200 text-xs mt-3 leading-relaxed">
                                            <b>Nhận xét chuyên môn KHKT: </b>
                                            Mặc dù đốt hỗn hợp cho sản lượng điện danh nghĩa cao hơn (37.75 kWh vs 17.85 kWh), nhưng làm mất hoàn toàn 32 kg nhựa, giấy và làm tăng nguy cơ sinh khí độc do đốt lẫn pin. Phân loại trước xử lý mang lại tổng giá trị tài nguyên bền vững cao hơn.
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ==================================================== */}
                            {/* TAB 6: TÌM HIỂU & SERAPHIN                          */}
                            {/* ==================================================== */}
                            {currentTab === 'education' && (
                                <div className="space-y-5">
                                    <div className="pb-2 border-b border-emerald-950/10">
                                        <h1 className="text-2xl font-extrabold text-[#07241b]">Tìm Hiểu Điện Rác & Tư Liệu Seraphin</h1>
                                        <p className="text-xs sm:text-sm text-slate-600">Ghi chép khảo sát thực địa của học sinh THPT Chuyên Chu Văn An và luyện tập tình huống.</p>
                                    </div>

                                    <div className="p-5 bg-gradient-to-r from-[#093324] to-[#175d41] text-white rounded-2xl shadow-sm">
                                        <h3 className="font-bold text-lg">Chuyên đề Khảo sát: Nhà máy Điện rác Seraphin (Hà Nội)</h3>
                                        <p className="text-xs text-emerald-100 mt-1">
                                            Tư liệu khảo sát kỹ thuật thực địa. Chú thích: Nhà máy là đối tượng khảo sát kỹ thuật của học sinh, không phải đơn vị triển khai phần mềm WasteLab.
                                        </p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-1.5 shadow-sm">
                                            <b className="text-sm text-[#07241b] block">1. Thu hồi kim loại từ xỉ đáy sau đốt</b>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                Sau khi rác cháy ở nhiệt độ trên 850°C, phần xỉ đáy còn lại (~15-20% khối lượng) được nam châm tách thu hồi sắt, nhôm. Điều này khẳng định: Tách vật liệu ngay từ đầu hiệu quả hơn nhiều.
                                            </p>
                                        </div>

                                        <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-1.5 shadow-sm">
                                            <b className="text-sm text-[#07241b] block">2. Kiểm soát tro bay (Fly Ash)</b>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                Tro bay (~2-3% khối lượng) giữ lại tại bộ lọc túi vải có chứa dioxin và kim loại nặng. Phần này được hóa rắn bằng xi măng và chôn lấp chất thải nguy hại riêng.
                                            </p>
                                        </div>

                                        <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-1.5 shadow-sm">
                                            <b className="text-sm text-[#07241b] block">3. Hao hụt nước rỉ rác (15-20%)</b>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                Rác tiếp nhận tại bể chứa được ủ từ 3-7 ngày để ép chảy nước rác. Khối lượng nạp vào phễu lò nhẹ hơn khối lượng cân lúc nhập trạm.
                                            </p>
                                        </div>

                                        <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-1.5 shadow-sm">
                                            <b className="text-sm text-[#07241b] block">4. Chuỗi công nghệ phát điện</b>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                Lò ghi cơ học ➔ Nồi hơi thu nhiệt ➔ Tua-bin hơi nước (40 bar, 400°C) ➔ Máy phát điện đồng bộ nâng áp hòa lưới 110kV.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL GHI BÀN GIAO THỰC TẾ (PAGE 8) */}
                    {handoverModalOpen && targetBatch && (
                        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                                <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                                    <h3 className="font-bold text-sm text-slate-900">Ghi Bàn Giao: {targetBatch.name}</h3>
                                    <button onClick={() => setHandoverModalOpen(false)} className="text-slate-400">✕</button>
                                </div>

                                <div className="text-xs space-y-3">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-1">Khối lượng cân trình giao tại điểm (kg):</label>
                                        <input
                                            type="number"
                                            value={offeredInput}
                                            onChange={(e) => {
                                                const val = Number(e.target.value);
                                                setOfferedInput(val);
                                                setAcceptedInput(val);
                                                setRejectedInput(0);
                                            }}
                                            className="w-full p-2 border border-slate-200 rounded-lg font-mono font-bold"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-xl">
                                        <div>
                                            <label className="block font-bold text-emerald-800 mb-1">Được nhận (kg):</label>
                                            <input
                                                type="number"
                                                value={acceptedInput}
                                                onChange={(e) => {
                                                    const val = Number(e.target.value);
                                                    setAcceptedInput(val);
                                                    setRejectedInput(offeredInput - val);
                                                }}
                                                className="w-full p-1.5 border border-emerald-300 rounded font-mono font-bold text-emerald-800"
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-red-700 mb-1">Bị từ chối (kg):</label>
                                            <input
                                                type="number"
                                                value={rejectedInput}
                                                onChange={(e) => {
                                                    const val = Number(e.target.value);
                                                    setRejectedInput(val);
                                                    setAcceptedInput(offeredInput - val);
                                                }}
                                                className="w-full p-1.5 border border-red-300 rounded font-mono font-bold text-red-700"
                                            />
                                        </div>
                                    </div>

                                    {rejectedInput > 0 && (
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">Lý do từ chối:</label>
                                            <input
                                                type="text"
                                                value={rejectionReasonInput}
                                                onChange={(e) => setRejectionReasonInput(e.target.value)}
                                                placeholder="VD: Dính dầu mỡ, lẫn tạp chất..."
                                                className="w-full p-2 border border-slate-200 rounded-lg"
                                            />
                                        </div>
                                    )}

                                    <div className="flex justify-end gap-2 pt-2">
                                        <button onClick={() => setHandoverModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-lg font-semibold">Hủy</button>
                                        <button onClick={handleRecordHandover} className="px-4 py-2 bg-emerald-700 text-white rounded-lg font-bold">Xác nhận lưu nhật ký</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TOAST */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-[#07241b] text-white px-4 py-3 rounded-xl shadow-xl border border-emerald-500/40 text-xs font-semibold">
                            ✓ {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
